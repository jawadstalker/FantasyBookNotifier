name: Python checks

on:
  push:
    branches: ["main", "improve/**", "feature/**"]
  pull_request:
    branches: ["main", "improve/**", "feature/**"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m compileall -q app.py books_scraper_full.py celery_app.py database.py tasks.py nlp.py character.py persian.py review.py migrations tests
      - name: Install test dependencies
        run: python -m pip install "SQLAlchemy>=2.0,<3.0" "alembic>=1.13,<2.0" "pytest>=8.0,<9.0" "Flask>=3.0,<4.0" "celery[redis]>=5.3,<6.0" "scikit-learn>=1.4,<2.0"
      - name: Validate database migration
        run: alembic upgrade head
      - name: Run database tests
        run: PYTHONPATH=. pytest -q
