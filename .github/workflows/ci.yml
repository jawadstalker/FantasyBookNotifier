name: Python checks

on:
  push:
    branches: ["main", "improve/**", "feature/**"]
  pull_request:
    branches: ["main", "improve/**"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m compileall -q app.py books_scraper_full.py celery_app.py database.py tasks.py nlp.py character.py persian.py review.py
